<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial;
}

/* SAHNE */
#stage{
position:fixed;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:black;
}

/* START BUTTON */
#playBtn{
position:absolute;
z-index:20;
width:120px;
height:120px;
background:black;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 0 30px rgba(0,0,0,0.8);
}

#playBtn:after{
content:"";
border-left:35px solid white;
border-top:20px solid transparent;
border-bottom:20px solid transparent;
margin-left:6px;
}

/* PERDE */
.curtain{
position:absolute;
top:0;
width:50%;
height:100%;
background-image:url("curtain.jpg");
background-size:200% 100%;
background-repeat:no-repeat;
transition:2.2s ease;
z-index:10;
}

#leftCurtain{left:0;background-position:left center;}
#rightCurtain{right:0;background-position:right center;}

.openLeft{transform:translateX(-100%);}
.openRight{transform:translateX(100%);}

/* COUNTDOWN */
#countdown{
position:absolute;
width:100%;
height:100%;
display:none;
z-index:5;
}

#countVideo{
width:100%;
height:100%;
object-fit:cover;
}

/* FLASH */
#flash{
position:fixed;
width:100%;
height:100%;
background:white;
opacity:0;
transition:0.3s;
z-index:50;
pointer-events:none;
}

/* FINAL */
#final{
display:none;
position:fixed;
width:100%;
height:100%;
background:black;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:5;
}

#photo{
width:80%;
max-width:420px;
border-radius:20px;
}

/* YAZI */
#loveText{
color:white;
font-size:28px;
margin-top:20px;
opacity:0;
transition:1.5s;
}

/* GÜL */
.rose{
position:absolute;
width:26px;
top:100vh;
transition:1s linear;
filter: drop-shadow(0 0 6px rgba(255,0,0,0.6));
}

/* DÖNME */
.spin{
animation:spin 2s linear infinite;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

/* NABIZ */
.pulse{
animation:pulse 1s ease-in-out infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.15);}
100%{transform:scale(1);}
}

</style>
</head>

<body onclick="restart()">

<div id="stage">
  <div id="playBtn" onclick="start()"></div>

  <div id="leftCurtain" class="curtain"></div>
  <div id="rightCurtain" class="curtain"></div>

  <div id="countdown">
    <video id="countVideo" src="countdown.mp4"></video>
  </div>
</div>

<div id="flash"></div>

<div id="final">
  <img id="photo" src="image.jpg">
  <div id="loveText">Seni Seviyorum ❤️</div>
</div>

<audio id="confetti" src="confetti.mp3"></audio>

<script>

let roses=[];

function start(){
  event.stopPropagation();
  document.getElementById("playBtn").style.display="none";

  document.getElementById("leftCurtain").classList.add("openLeft");
  document.getElementById("rightCurtain").classList.add("openRight");

  setTimeout(playCountdown,2200);
}

function playCountdown(){
  let c=document.getElementById("countdown");
  let v=document.getElementById("countVideo");

  c.style.display="block";
  v.play();

  v.onended=flash;
}

function flash(){
  let f=document.getElementById("flash");

  f.style.opacity="1";

  setTimeout(()=>{
    f.style.opacity="0";
    showFinal();
  },300);
}

function showFinal(){
  document.getElementById("stage").style.display="none";
  document.getElementById("final").style.display="flex";

  document.getElementById("confetti").play();

  createRoses();
}

/* 🌹 GÜLLER */
function createRoses(){
  for(let i=0;i<500;i++){
    let r=document.createElement("img");
    r.src="rose.png";
    r.className="rose spin";

    r.style.left=Math.random()*100+"%";

    document.body.appendChild(r);
    roses.push(r);
  }

  setTimeout(transformToHeart,1500);
}

/* ❤️ %100 DOLU KALP */
function transformToHeart(){
  let cx = window.innerWidth/2;
  let cy = window.innerHeight/2;

  let scale = 20;
  let density = 10;

  let points = [];

  for(let x=-density; x<=density; x+=0.3){
    for(let y=-density; y<=density; y+=0.3){

      let nx = x / density;
      let ny = y / density;

      let eq = Math.pow(nx*nx + ny*ny -1,3) - nx*nx*ny*ny*ny;

      if(eq <= 0){
        points.push({x,y});
      }
    }
  }

  points.sort(()=>Math.random()-0.5);

  roses.forEach((r,i)=>{
    let p = points[i % points.length];

    let finalX = cx + p.x * scale;
    let finalY = cy - p.y * scale;

    let dx = cx - finalX;
    let dy = cy - finalY;
    let angle = Math.atan2(dy, dx) * (180 / Math.PI);

    r.style.transition="1.5s ease";
    r.style.left=(finalX - 13)+"px";
    r.style.top=(finalY - 13)+"px";

    r.classList.remove("spin");

    r.style.transform = `rotate(${angle}deg) scale(1.05)`;

    r.classList.add("pulse");
  });

  document.getElementById("loveText").style.opacity="1";
}

/* RESET */
function restart(){
  location.reload();
}

</script>

</body>
</html>
