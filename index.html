<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial;
}

#stage{
position:fixed;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:black;
}

#playBtn{
position:absolute;
z-index:20;
width:120px;
height:120px;
background:black;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 0 30px rgba(0,0,0,0.8);
}

#playBtn:after{
content:"";
border-left:35px solid white;
border-top:20px solid transparent;
border-bottom:20px solid transparent;
margin-left:6px;
}

.curtain{
position:absolute;
top:0;
width:50%;
height:100%;
background-image:url("curtain.jpg");
background-size:200% 100%;
background-repeat:no-repeat;
transition:2.2s ease;
z-index:10;
}

#leftCurtain{left:0;background-position:left center;}
#rightCurtain{right:0;background-position:right center;}

.openLeft{transform:translateX(-100%);}
.openRight{transform:translateX(100%);}

#countdown{
position:absolute;
width:100%;
height:100%;
display:none;
z-index:5;
}

#countVideo{
width:100%;
height:100%;
object-fit:cover;
}

#flash{
position:fixed;
width:100%;
height:100%;
background:white;
opacity:0;
transition:0.3s;
z-index:50;
pointer-events:none;
}

#final{
display:none;
position:fixed;
width:100%;
height:100%;
background:black;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:5;
}

#photo{
width:80%;
max-width:420px;
border-radius:20px;
z-index:1;
}

/* 🎉 CONFETTI */
#confettiBox{
margin-top:15px;
display:flex;
flex-direction:column;
align-items:center;
}

#confettiImg{
width:120px;
cursor:pointer;
filter:drop-shadow(0 0 10px rgba(255,255,255,0.5));
transition:0.15s;
}

#confettiImg:active{
transform:scale(0.95);
}

#loveText{
color:white;
font-size:28px;
margin-top:20px;
opacity:0;
transition:1.5s;
z-index:3;
}

#heartCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:2;
pointer-events:none;
}
</style>
</head>

<body onclick="restart()">

<div id="stage">
  <div id="playBtn" onclick="start()"></div>

  <div id="leftCurtain" class="curtain"></div>
  <div id="rightCurtain" class="curtain"></div>

  <div id="countdown">
    <video id="countVideo" src="countdown.mp4"></video>
  </div>
</div>

<div id="flash"></div>

<div id="final">
  <canvas id="heartCanvas"></canvas>

  <img id="photo" src="image.jpg">

  <div id="confettiBox">
    <img id="confettiImg" src="confetti.png" onclick="triggerConfetti(event)">
  </div>

  <div id="loveText">Seni Seviyorum ❤️</div>
</div>

<audio id="confetti" src="confetti.mp3"></audio>

<script>

let canvas, ctx;
let floatingHearts = [];
let burstHearts = [];

function start(){
  event.stopPropagation();
  document.getElementById("playBtn").style.display="none";

  document.getElementById("leftCurtain").classList.add("openLeft");
  document.getElementById("rightCurtain").classList.add("openRight");

  setTimeout(playCountdown,2200);
}

function playCountdown(){
  let c=document.getElementById("countdown");
  let v=document.getElementById("countVideo");

  c.style.display="block";
  v.play();

  v.onended=flash;
}

function flash(){
  let f=document.getElementById("flash");

  f.style.opacity="1";

  setTimeout(()=>{
    f.style.opacity="0";
    showFinal();
  },300);
}

function showFinal(){
  document.getElementById("stage").style.display="none";
  document.getElementById("final").style.display="flex";

  initCanvas();
  createFloatingHearts();

  document.getElementById("loveText").style.opacity="1";
}

/* 🎉 TETİK */
function triggerConfetti(e){
  e.stopPropagation();

  let audio = document.getElementById("confetti");
  audio.currentTime = 0;
  audio.play();

  createBurstHearts();
}

/* CANVAS */
function initCanvas(){
  canvas = document.getElementById("heartCanvas");
  ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

/* 💖 ALT KALPLER (DAHA YOĞUN) */
function createFloatingHearts(){
  setInterval(()=>{
    floatingHearts.push({
      x: Math.random()*canvas.width,
      y: canvas.height + 20,
      size: Math.random()*10+8,
      speed: Math.random()*2+1,
      alpha: 1
    });
  },120);

  animate();
}

/* 💥 KONSER PATLAMASI */
function createBurstHearts(){
  let photo = document.getElementById("photo");
  let rect = photo.getBoundingClientRect();

  for(let i=0;i<60;i++){
    burstHearts.push({
      x: rect.left + rect.width/2,
      y: rect.top + rect.height/2,
      vx: (Math.random()-0.5)*10,
      vy: (Math.random()-0.5)*10,
      size: Math.random()*12+10,
      alpha:1
    });
  }
}

/* ❤️ PARLAK KALP */
function drawHeart(x,y,size,alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x,y);
  ctx.scale(size/10,size/10);

  ctx.shadowBlur = 15;
  ctx.shadowColor = "#ff4d6d";

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(0,-3,-5,-3,-5,0);
  ctx.bezierCurveTo(-5,3,0,5,0,7);
  ctx.bezierCurveTo(0,5,5,3,5,0);
  ctx.bezierCurveTo(5,-3,0,-3,0,0);
  ctx.fillStyle="#ff2d55";
  ctx.fill();

  ctx.restore();
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  floatingHearts.forEach(h=>{
    h.y -= h.speed;
    h.alpha -= 0.002;
    drawHeart(h.x,h.y,h.size,h.alpha);
  });

  burstHearts.forEach(h=>{
    h.x += h.vx;
    h.y += h.vy;
    h.alpha -= 0.015;
    drawHeart(h.x,h.y,h.size,h.alpha);
  });

  floatingHearts = floatingHearts.filter(h=>h.alpha>0);
  burstHearts = burstHearts.filter(h=>h.alpha>0);

  requestAnimationFrame(animate);
}

function restart(){
  location.reload();
}

</script>

</body>
</html>
