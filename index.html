<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial;
}

/* SAHNE */
#stage{
position:fixed;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:black;
}

/* START BUTTON */
#playBtn{
position:absolute;
z-index:20;
width:120px;
height:120px;
background:black;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 0 30px rgba(0,0,0,0.8);
}

#playBtn:after{
content:"";
border-left:35px solid white;
border-top:20px solid transparent;
border-bottom:20px solid transparent;
margin-left:6px;
}

/* PERDE */
.curtain{
position:absolute;
top:0;
width:50%;
height:100%;
background-image:url("curtain.jpg");
background-size:200% 100%;
background-repeat:no-repeat;
transition:2.2s ease;
z-index:10;
}

#leftCurtain{left:0;background-position:left center;}
#rightCurtain{right:0;background-position:right center;}

.openLeft{transform:translateX(-100%);}
.openRight{transform:translateX(100%);}

/* COUNTDOWN VIDEO */
#countdown{
position:absolute;
width:100%;
height:100%;
display:none;
z-index:5;
}

#countVideo{
width:100%;
height:100%;
object-fit:cover;
}

/* FLASH */
#flash{
position:fixed;
width:100%;
height:100%;
background:white;
opacity:0;
transition:0.3s;
z-index:50;
pointer-events:none;
}

/* FINAL */
#final{
display:none;
position:fixed;
width:100%;
height:100%;
background:black;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:5;
}

#photo{
width:80%;
max-width:420px;
border-radius:20px;
}

/* GÜL */
.rose{
position:absolute;
width:25px;
animation:rise 4s linear forwards;
}

@keyframes rise{
0%{transform:translateY(100vh);opacity:1}
100%{transform:translateY(-10vh);opacity:0}
}

/* KALP FORMU */
.heartRose{
position:absolute;
width:22px;
animation:fade 1s ease forwards;
opacity:0;
}

@keyframes fade{
to{opacity:1}
}
</style>
</head>

<body>

<div id="stage">
  <div id="playBtn" onclick="start()"></div>

  <div id="leftCurtain" class="curtain"></div>
  <div id="rightCurtain" class="curtain"></div>

  <div id="countdown">
    <video id="countVideo" src="countdown.mp4"></video>
  </div>
</div>

<div id="flash"></div>

<div id="final">
  <img id="photo" src="image.jpg">
</div>

<audio id="confetti" src="confetti.mp3"></audio>

<script>

function start(){
  document.getElementById("playBtn").style.display="none";

  document.getElementById("leftCurtain").classList.add("openLeft");
  document.getElementById("rightCurtain").classList.add("openRight");

  setTimeout(playCountdown,2200);
}

/* COUNTDOWN */
function playCountdown(){
  let c=document.getElementById("countdown");
  let v=document.getElementById("countVideo");

  c.style.display="block";
  v.play();

  v.onended=flash;
}

/* FLASH */
function flash(){
  let f=document.getElementById("flash");

  f.style.opacity="1";

  setTimeout(()=>{
    f.style.opacity="0";
    showFinal();
  },300);
}

/* FINAL */
function showFinal(){
  document.getElementById("stage").style.display="none";
  document.getElementById("final").style.display="flex";

  document.getElementById("confetti").play();

  createRoses();
  setTimeout(createHeart,1500);
}

/* GÜL YAĞMURU */
function createRoses(){
  for(let i=0;i<45;i++){
    let r=document.createElement("img");
    r.src="rose.png";
    r.className="rose";
    r.style.left=Math.random()*100+"%";
    document.body.appendChild(r);
  }
}

/* KALP ŞEKLİ */
function createHeart(){
  let cx=window.innerWidth/2;
  let cy=window.innerHeight/2;

  for(let t=0;t<Math.PI*2;t+=0.2){
    let x=16*Math.pow(Math.sin(t),3);
    let y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));

    let r=document.createElement("img");
    r.src="rose.png";
    r.className="heartRose";

    r.style.left=(cx + x*10 -10)+"px";
    r.style.top=(cy + y*10 -10)+"px";

    document.body.appendChild(r);
  }
}

</script>

</body>
</html>
