<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:Arial;
}

/* SAHNE */
#stage{
position:fixed;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
background:black;
}

/* PLAY */
#playBtn{
position:absolute;
z-index:20;
width:120px;
height:120px;
background:black;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 0 30px rgba(0,0,0,0.8);
}
#playBtn:after{
content:"";
border-left:35px solid white;
border-top:20px solid transparent;
border-bottom:20px solid transparent;
}

/* PERDE */
.curtain{
position:absolute;
top:0;
width:50%;
height:100%;
background-image:url("curtain.jpg");
background-size:200% 100%;
transition:2.2s;
z-index:10;
}
#leftCurtain{left:0;}
#rightCurtain{right:0;}
.openLeft{transform:translateX(-100%);}
.openRight{transform:translateX(100%);}

/* COUNTDOWN */
#countdown{
position:absolute;
width:100%;
height:100%;
display:none;
}
video{
width:100%;
height:100%;
object-fit:cover;
}

/* FLASH */
#flash{
position:fixed;
width:100%;
height:100%;
background:white;
opacity:0;
transition:0.3s;
z-index:50;
}

/* FINAL */
#final{
display:none;
position:fixed;
width:100%;
height:100%;
background:black;
align-items:center;
justify-content:center;
flex-direction:column;
}

/* FOTO */
#photo{
width:80%;
max-width:420px;
border-radius:20px;
z-index:2;
}

/* YAZI */
#loveText{
color:white;
font-size:28px;
margin-top:20px;
opacity:0;
transition:1.5s;
z-index:2;
}

/* CANVAS */
#heartCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
pointer-events:none;
}

</style>
</head>

<body onclick="restart()">

<div id="stage">
  <div id="playBtn" onclick="start()"></div>

  <div id="leftCurtain" class="curtain"></div>
  <div id="rightCurtain" class="curtain"></div>

  <div id="countdown">
    <video id="countVideo" src="countdown.mp4"></video>
  </div>
</div>

<div id="flash"></div>

<div id="final">
  <canvas id="heartCanvas"></canvas>
  <img id="photo" src="image.jpg">
  <div id="loveText">Seni Seviyorum ❤️</div>
</div>

<audio id="confetti" src="confetti.mp3"></audio>

<script>

let canvas, ctx, particles=[];

function start(){
  event.stopPropagation();
  document.getElementById("playBtn").style.display="none";
  leftCurtain.classList.add("openLeft");
  rightCurtain.classList.add("openRight");
  setTimeout(playCountdown,2200);
}

function playCountdown(){
  let v=document.getElementById("countVideo");
  countdown.style.display="block";
  v.play();
  v.onended=flash;
}

function flash(){
  flashEl.style.opacity="1";
  setTimeout(()=>{
    flashEl.style.opacity="0";
    showFinal();
  },300);
}

function showFinal(){
  stage.style.display="none";
  final.style.display="flex";

  document.getElementById("confetti").play();

  initCanvas();
  createHeartParticles();

  document.getElementById("loveText").style.opacity="1";
}

/* CANVAS */
function initCanvas(){
  canvas=document.getElementById("heartCanvas");
  ctx=canvas.getContext("2d");

  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

/* PARÇACIK OLUŞTUR */
function createHeartParticles(){
  let cx=canvas.width/2;
  let cy=canvas.height/2;

  for(let i=0;i<900;i++){

    let t=Math.random()*Math.PI*2;
    let r=Math.random();

    let x=16*Math.pow(Math.sin(t),3)*r;
    let y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*r;

    particles.push({
      x:cx + x*18,
      y:cy + y*18,
      size:Math.random()*3+2,
      angle:Math.random()*360,
      speed:Math.random()*0.5
    });
  }

  animate();
}

/* ANİMASYON */
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.angle += p.speed;

    let gradient=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*3);
    gradient.addColorStop(0,"#ff4d6d");
    gradient.addColorStop(1,"rgba(255,0,0,0)");

    ctx.fillStyle=gradient;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

/* RESET */
function restart(){
  location.reload();
}

</script>

</body>
</html>
