<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love</title>

<style>
body{margin:0;background:black;overflow:hidden;font-family:Arial;}
#stage{position:fixed;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:black;}

#playBtn{
position:absolute;z-index:20;width:120px;height:120px;background:black;border-radius:50%;
display:flex;align-items:center;justify-content:center;cursor:pointer;
box-shadow:0 0 30px rgba(0,0,0,0.8);
}
#playBtn:after{
content:"";border-left:35px solid white;border-top:20px solid transparent;border-bottom:20px solid transparent;margin-left:6px;
}

.curtain{
position:absolute;top:0;width:50%;height:100%;
background-image:url("curtain.jpg");
background-size:200% 100%;
background-repeat:no-repeat;
transition:2.2s ease;
z-index:10;
}
#leftCurtain{left:0;background-position:left center;}
#rightCurtain{right:0;background-position:right center;}

.openLeft{transform:translateX(-100%);}
.openRight{transform:translateX(100%);}

#count{
position:absolute;
color:white;
font-size:120px;
font-weight:bold;
display:none;
z-index:5;
}

#flash{
position:fixed;width:100%;height:100%;
background:white;opacity:0;transition:0.3s;
}

#final{
display:none;
position:fixed;
width:100%;
height:100%;
background:black;
align-items:center;
justify-content:center;
flex-direction:column;
}

#photo{
width:80%;
max-width:400px;
border-radius:20px;
z-index:10;
}

/* Güller */
.rose{
position:absolute;
width:25px;
animation:rise 4s linear forwards;
}

@keyframes rise{
0%{transform:translateY(100vh);opacity:1}
100%{transform:translateY(30vh);opacity:1}
}

/* Kalp oluşumu */
.heartRose{
position:absolute;
width:22px;
animation:fadeIn 1s ease forwards;
opacity:0;
}

@keyframes fadeIn{
to{opacity:1}
}

</style>
</head>
<body>

<div id="stage">
  <div id="playBtn" onclick="start()"></div>
  <div id="leftCurtain" class="curtain"></div>
  <div id="rightCurtain" class="curtain"></div>
  <div id="count"></div>
</div>

<div id="flash"></div>

<div id="final">
  <img id="photo" src="image.jpg">
</div>

<audio id="boom" src="confetti.mp3"></audio>

<script>

function start(){
  document.getElementById("playBtn").style.display="none";

  document.getElementById("leftCurtain").classList.add("openLeft");
  document.getElementById("rightCurtain").classList.add("openRight");

  setTimeout(countdown,2200);
}

/* 3-2-1 */
function countdown(){
  let c=document.getElementById("count");
  c.style.display="block";

  let nums=["3","2","1"];
  let i=0;

  let interval=setInterval(()=>{
    c.innerText=nums[i];
    i++;

    if(i===nums.length){
      clearInterval(interval);
      setTimeout(flash,800);
    }
  },800);
}

/* Flash */
function flash(){
  let f=document.getElementById("flash");
  f.style.opacity="1";

  setTimeout(()=>{
    f.style.opacity="0";
    showFinal();
  },300);
}

/* Final sahne */
function showFinal(){
  document.getElementById("stage").style.display="none";
  document.getElementById("final").style.display="flex";

  document.getElementById("boom").play();

  createRoses();
  setTimeout(createHeart,2000);
}

/* Güller yükselir */
function createRoses(){
  for(let i=0;i<40;i++){
    let r=document.createElement("img");
    r.src="rose.png";
    r.className="rose";
    r.style.left=Math.random()*100+"%";
    document.body.appendChild(r);
  }
}

/* Kalp şekli */
function createHeart(){
  let centerX=window.innerWidth/2;
  let centerY=window.innerHeight/2;

  for(let t=0;t<Math.PI*2;t+=0.2){
    let x=16*Math.pow(Math.sin(t),3);
    let y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));

    let r=document.createElement("img");
    r.src="rose.png";
    r.className="heartRose";

    r.style.left=(centerX + x*10 -10)+"px";
    r.style.top=(centerY + y*10 -10)+"px";

    document.body.appendChild(r);
  }
}

</script>

</body>
</html>
